<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Mission Control</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#f9fafb;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,rgba(8,145,178,.16),transparent 35%),radial-gradient(circle at 10% 0%,rgba(30,64,175,.16),transparent 35%),#000}
main{width:min(380px,90vw);padding:28px;border:1px solid #1f2937;border-radius:14px;background:rgba(10,15,26,.85);display:grid;gap:12px}
b{font-size:20px}b span{background:linear-gradient(90deg,#3c83f6,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
small{color:#6b7280;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
p{margin:0;color:#9ca3af;font-size:14px;line-height:1.5}
.bar{height:3px;border-radius:9px;background:#111827;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#3c83f6,#06b6d4);animation:s 1.1s ease-in-out infinite}
@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
a{color:#22d3ee}.err{color:#fca5a5}
</style>
</head>
<body>
<main>
  <div><b>Mission <span>Control</span></b><br><small>Quant Trading · Ops</small></div>
  <div class="bar" id="bar"><i></i></div>
  <p id="msg">Connecting to your home PC…</p>
</main>
<script>
(async()=>{
  const msg=document.getElementById("msg"),bar=document.getElementById("bar");
  const fail=t=>{bar.style.display="none";msg.className="err";msg.innerHTML=t};
  try{
    const r=await fetch("url.json?t="+Date.now(),{cache:"no-store"});
    const {url,updated}=await r.json();
    if(!url) return fail("No address published yet.");
    try{ await fetch(url+"/api/health",{mode:"no-cors",cache:"no-store"}); }
    catch(e){ return fail("Your home PC isn't reachable right now (off, asleep, or restarting). Last address update: "+new Date(updated).toLocaleString()+".<br><br><a href='"+url+"'>Try anyway</a>"); }
    location.replace(url+"/"+location.hash);
  }catch(e){ fail("Couldn't load the current address. Refresh in a minute."); }
})();
</script>
</body>
</html>
